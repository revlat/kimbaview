[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kimbaview"
dynamic = ["version"]
description = "Desktop viewer for Markdown and MediaWiki files with live updates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "revlat" }]
dependencies = [
    "pywebview>=5.3",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "nh3>=0.2.18",
    "watchdog>=4.0",
    "Pygments>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10", "pillow>=10"]
qt = ["pywebview[qt]"]

[project.gui-scripts]
kimbaview = "kimbaview.app:main"

[tool.setuptools.dynamic]
version = { attr = "kimbaview.__version__" }   # einzige Stelle: src/kimbaview/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kimbaview = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
